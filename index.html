<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Трекер свежести</title>
<meta name="description" content="Следит за сроками годности продуктов и готовых блюд. Общие холодильники для семьи.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121315" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Свежесть">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: one column, a calm list of rings, a sheet for input. */
:root{
  --bg:#f4f4f1; --fg:#15171a; --mute:#8b9097; --line:#e3e4df; --card:#ffffff; --track:#e9eae5;
  --ok:#2f9466; --warn:#c98a1f; --bad:#cf4d39; --accent:#15171a; --acc-fg:#f4f4f1;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121315; --fg:#eceee9; --mute:#7d838a; --line:#26282c; --card:#1b1d20; --track:#2a2d31;
    --ok:#4fc08a; --warn:#e8a947; --bad:#e8705c; --accent:#eceee9; --acc-fg:#121315;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121315; --fg:#eceee9; --mute:#7d838a; --line:#26282c; --card:#1b1d20; --track:#2a2d31;
  --ok:#4fc08a; --warn:#e8a947; --bad:#e8705c; --accent:#eceee9; --acc-fg:#121315;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img,svg{-webkit-user-drag:none;user-drag:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
html,body{margin:0}
body{
  min-height:100%; background:var(--bg); color:var(--fg);
  font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.4; -webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(8px,env(safe-area-inset-top,0px)); padding-bottom:120px;
}
header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;column-gap:12px;row-gap:8px;padding-top:20px}
h1{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin:0}
.chip{grid-column:1/-1;justify-self:start;display:inline-flex;align-items:center;gap:8px;max-width:100%;border:1px solid var(--line);background:transparent;color:var(--mute);font:inherit;font-size:13px;padding:5px 11px 5px 12px;border-radius:999px;cursor:pointer;transition:color .2s,border-color .2s}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);flex:none}
.chip:active{color:var(--fg);border-color:var(--mute)}
.stat{font-size:13px;color:var(--mute);white-space:nowrap;transition:color .3s}
.stat.warn{color:var(--warn);font-weight:500}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%;background:var(--track);border-radius:16px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:var(--mute);font:inherit;font-size:14px;height:40px;padding:0 8px;border-radius:12px;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
#seg{margin:20px 0 16px}

.list{display:flex;flex-direction:column;gap:8px}
.item{
  display:flex;align-items:center;gap:14px;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px 14px 14px;
  color:inherit;font:inherit;text-align:left;cursor:pointer;
  transition:transform .15s ease,translate .25s ease;touch-action:pan-y;
  --c:var(--ok);
}
.item:active{transform:scale(.985)}
.item.enter{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ring{position:relative;width:56px;height:56px;flex:none}
.ring svg{width:56px;height:56px;display:block;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--track)}
.ring .fg{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.7,.2,1),stroke .3s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.name{font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-weight:500}
.st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)}
.empty{color:var(--mute);text-align:center;padding:64px 12px;margin:0;font-size:14px}
.foot{color:var(--mute);font-size:12px;text-align:center;margin:20px 0 0;font-variant-numeric:tabular-nums}

.fab{
  position:fixed;z-index:10;left:0;right:0;margin:0 auto;width:fit-content;
  bottom:max(22px,calc(env(safe-area-inset-bottom,0px) + 8px));
  height:56px;padding:0 28px 0 22px;border-radius:999px;border:0;background:var(--accent);color:var(--acc-fg);
  font:500 16px/1 "Golos Text",system-ui,sans-serif;display:flex;align-items:center;gap:10px;
  cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.22);transition:transform .2s ease;
}
.fab span{font:300 28px/1 system-ui,sans-serif;margin-top:-2px}
.fab:active{transform:scale(.96)}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:calc(110px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 70%);pointer-events:none;z-index:5}

.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
  border-radius:28px 28px 0 0;max-height:90vh;overflow-y:auto;
  padding:10px max(18px,env(safe-area-inset-right,0px)) max(22px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);
}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 16px}
.sh{font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.hint{color:var(--mute);font-size:13px;margin:6px 0 0}
.tabs{margin-bottom:16px}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--mute)}
.field input,.field select{
  width:100%;min-height:52px;display:block;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:16px;
  padding:0 16px;font:inherit;font-size:16px;outline:none;transition:border-color .2s;
  appearance:none;-webkit-appearance:none;
}
.field input:focus,.field select:focus{border-color:var(--mute)}
.sugg{display:flex;flex-direction:column;margin:-4px 0 0}
.sugg:empty{display:none}
.sugg button{display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:48px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;color:var(--fg);font:inherit;text-align:left;cursor:pointer;animation:rise .3s ease both}
.sugg small{color:var(--mute);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.primary,.ghost{width:100%;height:52px;display:flex;align-items:center;justify-content:center;border:0;border-radius:16px;padding:0 16px;font:inherit;font-size:16px;font-weight:500;cursor:pointer;transition:transform .15s,opacity .2s}
.primary:disabled{opacity:.5}
.form>.primary{margin-top:6px}
.form>.ghost{margin-top:-4px}
.primary{background:var(--accent);color:var(--acc-fg)}
.ghost{background:var(--track);color:var(--fg)}
.primary:active,.ghost:active{transform:scale(.98)}
.actions{display:grid;gap:10px;margin-top:20px}

.code{font-size:34px;font-weight:600;letter-spacing:.18em;text-align:center;padding:18px 0 18px .18em;margin:14px 0 10px;background:var(--bg);border-radius:16px}
.check{display:flex;align-items:center;gap:10px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.err{color:var(--bad);font-size:13px;margin:0}
.toast{position:fixed;z-index:40;left:50%;bottom:max(96px,calc(env(safe-area-inset-bottom,0px) + 90px));transform:translate(-50%,12px);background:var(--accent);color:var(--acc-fg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.act{display:flex;align-items:center;gap:12px;width:max-content;padding:6px 6px 6px 16px}
.toast.act.show{pointer-events:auto}
.toast button{flex:none;border:0;border-radius:999px;height:32px;padding:0 14px;background:var(--acc-fg);color:var(--accent);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.toast button:active{opacity:.8}

/* свайпы и уход строки */
.sw{display:grid;grid-template-rows:1fr;transition:grid-template-rows .26s cubic-bezier(.2,.7,.2,1) .12s,opacity .26s ease .12s,margin .26s cubic-bezier(.2,.7,.2,1) .12s}
.swin{position:relative;min-height:0;overflow:hidden;border-radius:22px}
.swbg{position:absolute;inset:0;display:flex;align-items:center;padding:0 22px;border-radius:22px;color:var(--bg);font-weight:500;font-size:15px;opacity:0;pointer-events:none;transition:opacity .15s}
.swbg i{display:none;font-style:normal}
.sw.drag .swbg,.sw.out .swbg{opacity:1}
.sw.dl .swbg{background:var(--ok);justify-content:flex-end}
.sw.dl .swbg .r{display:block}
.sw.dr .swbg{background:var(--bad);justify-content:flex-start}
.sw.dr .swbg .l{display:block}
.sw.out{grid-template-rows:0fr;opacity:0;margin-bottom:-8px;pointer-events:none}
.sw.out.dl .item{translate:-110% 0!important;transition:translate .26s cubic-bezier(.4,0,1,1)!important}
.sw.out.dr .item{translate:110% 0!important;transition:translate .26s cubic-bezier(.4,0,1,1)!important}

/* сканер штрихкода */
.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3;margin:14px 0 8px}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .aim{position:absolute;left:12%;right:12%;top:30%;bottom:30%;border:2px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.28);pointer-events:none}
.scan [data-sc="bar"]{grid-column:1/-1}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mute);outline-offset:2px}

.dp{display:flex;flex-direction:column}
.dpbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:0 16px;font:inherit;font-size:16px;cursor:pointer;text-align:left;transition:border-color .2s}
.dpbtn svg{color:var(--mute);flex:none}
.dpbtn.empty .dpval{color:var(--mute)}
.dpbtn[aria-expanded="true"]{border-color:var(--mute)}
.dppanel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.2,.8,.2,1)}
.dppanel.open{grid-template-rows:1fr}
.dpin{overflow:hidden;min-height:0}
.dpchips{display:flex;gap:6px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.dpchips::-webkit-scrollbar{display:none}
.dpchips button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:13px;height:34px;padding:0 14px;border-radius:999px;cursor:pointer;transition:background .15s}
.dpchips button:active{background:var(--track)}
.dphead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:10px 0 2px}
.dphead b{text-align:center;font-weight:600;font-size:16px}
.dphead button{width:44px;height:44px;border:0;background:transparent;color:var(--fg);border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:background .15s}
.dphead button:active{background:var(--track)}
.dpgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0;padding-bottom:6px}
.dpgrid.flip{animation:rise .28s ease both}
.dpgrid i{font-style:normal;text-align:center;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;padding:8px 0}
.dpgrid button{width:42px;height:42px;margin:0 auto;border:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;font-variant-numeric:tabular-nums;border-radius:50%;cursor:pointer;transition:background .15s,transform .15s}
.dpgrid button:active{background:var(--track);transform:scale(.92)}
.dpgrid button.today{box-shadow:inset 0 0 0 1.5px var(--mute)}
.dpgrid button.sel{background:var(--accent);color:var(--acc-fg);font-weight:600;box-shadow:none}
.dpgrid button:disabled{color:var(--mute);opacity:.35;cursor:default}
.stepper{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:8px}
.stepper button{height:52px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:16px;font:300 26px/1 system-ui,sans-serif;cursor:pointer;transition:transform .15s,background .15s}
.stepper button:active{transform:scale(.94);background:var(--track)}
.stepper input{text-align:center;font-weight:500;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type="time"]{-webkit-appearance:none;appearance:none}

[hidden]{display:none!important}
.ghost:disabled{opacity:.5}
.qty{color:var(--mute);font-weight:400}
.scan{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scan .ghost{height:46px;font-size:15px}
.stg{display:flex;flex-direction:column;margin:-2px 0 0}
.stg:empty{display:none}
.srow{display:flex;align-items:center;border-bottom:1px solid var(--line);animation:rise .3s ease both}
.srow>button:first-child{flex:1;min-width:0;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:48px;background:none;border:0;padding:8px 2px;color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.srow>button:first-child>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow small{color:var(--mute);font-size:12px;white-space:nowrap}
.srow .x{flex:none;width:44px;height:44px;border:0;background:none;color:var(--mute);font:300 24px/1 system-ui,sans-serif;cursor:pointer}
.lnk{color:var(--fg);text-decoration:underline}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header>
  <h1>Свежесть</h1>
  <div class="stat" id="stat"></div>
  <button class="chip" id="chip" type="button"><span id="chipName">Мой холодильник</span></button>
</header>

<div class="seg" id="seg" role="tablist">
  <button class="on" data-f="all">Все</button>
  <button data-f="product">Продукты</button>
  <button data-f="dish">Блюда</button>
</div>

<main class="list" id="list"></main>
<p class="foot" id="foot"></p>

<button class="fab" id="fab" type="button" aria-label="Добавить"><span>+</span>Добавить</button>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" hidden>
<input type="file" id="imp" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status"></div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-hidden="true">
  <div class="grab"></div>
  <div id="sheetBody"></div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
<script>
const KEY = 'svezhest-v1';
const DAY = 864e5, HOUR = 36e5, C = 2 * Math.PI * 20;
const PLACE = { fridge: 'Холодильник', freezer: 'Морозилка', shelf: 'Полка' };

// Справочник: [название, срок хранения в сутках, слова для поиска]

  ['Оливье / крабовый без заправки', 2, 'оливье крабовый салат'],
  ['Сельдь под шубой', 1.5, 'селедка сельдь шуба'],
  ['Винегрет', 1.5, 'винегрет'],
  ['Оливье / крабовый заправленный', 1, 'оливье крабовый салат майонез'],
  ['Цезарь / греческий салат', 0.5, 'цезарь греческий салат'],
  ['Блины без начинки', 4, 'блины блинчики'],
  ['Пирог с ягодной или фруктовой начинкой', 4, 'пирог ягоды фрукты яблоки ягодный'],
  ['Пицца домашняя', 3, 'пицца'],
  ['Пирог с мясной или рыбной начинкой', 3, 'пирог мясной рыбный'],

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d && Array.isArray(d.items)) return d;
  }catch(e){}
  return { items:[], eaten:0, thrown:0 };
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
}

function plural(n, forms){
  const m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return forms[0];
  if(m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return forms[1];
  return forms[2];
}
const DAYS = ['день','дня','дней'];
const fmtDate = t => new Date(t).toLocaleDateString('ru-RU', { day:'numeric', month:'short' });
const fmtShelf = d => d < 1 ? Math.round(d * 24) + ' ч' : Number.isInteger(d) ? d + ' ' + plural(d, DAYS) : d + ' дн.';
const nowLocal = () => { const d = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4); return d.toISOString().slice(0,16); };

function leftText(r){
  if(r <= 0) return 'просрочено';
  if(r < DAY) return 'осталось ' + Math.max(1, Math.round(r / HOUR)) + ' ч';
  const d = Math.ceil(r / DAY);
  return 'осталось ' + d + ' ' + plural(d, DAYS);
}

function row(it, i, now){
  const total = Math.max(it.end - it.start, HOUR);
  const r = it.end - now;
  const frac = Math.min(1, Math.max(0, r / total));
  const st = r <= 0 ? 'bad' : r < 2 * DAY ? 'warn' : 'ok';
  const center = r <= 0 ? '0' : r < DAY ? Math.max(1, Math.round(r / HOUR)) + 'ч' : Math.ceil(r / DAY);
  const by = isShared() && names[it.by] ? ' · ' + names[it.by] : '';
  const info = (it.kind === 'product'
    ? `${PLACE[it.place] || 'Продукт'} · до ${fmtDate(it.end)}${it.opened ? ' · вскрыто' : ''}`
    : `Блюдо · с ${fmtDate(it.start)}`) + by;
  return `
  <div class="sw" data-id="${it.id}"><div class="swin"><span class="swbg" aria-hidden="true"><i class="l">Выбросить</i><i class="r">${(it.qty || 1) > 1 ? 'Съели одну' : 'Съели'}</i></span>
  <button class="item${animateIds.has(it.id) ? ' enter' : ''}" data-id="${it.id}" style="--c:var(--${st});animation-delay:${Math.min(i, 8) * 40}ms">
    <span class="ring">
      <svg viewBox="0 0 52 52" aria-hidden="true">
        <circle class="bg" cx="26" cy="26" r="20"/>
        <circle class="fg" cx="26" cy="26" r="20" style="stroke-dasharray:${C};stroke-dashoffset:${C * (1 - frac)}"/>
      </svg>
      <b>${center}</b>
    </span>
    <span class="meta">
      <span class="name">${esc(it.name)}${it.qty > 1 ? ' <span class="qty">×' + it.qty + '</span>' : ''}</span>
      <span class="info"><span class="st ${st}">${leftText(r)}</span> · ${esc(info)}</span>
    </span>
  </button></div></div>`;
}

function render(){
  if(swipe && swipe.on) return;
  const now = Date.now();
  const all = curItems().filter(i => !i.done);
  const items = all.filter(i => filter === 'all' || i.kind === filter).sort((a, b) => a.end - b.end);
  const loading = isShared() && !shared.ready;
  $('#list').innerHTML = loading
    ? '<p class="empty">Загрузка…</p>'
    : items.length
      ? items.map((it, i) => row(it, i, now)).join('')
      : `<p class="empty">${all.length ? 'В этом разделе пусто' : 'Пока пусто. Нажмите + и добавьте продукт или блюдо'}</p>`;
  const urgent = all.filter(i => i.end - now < 2 * DAY).length;
  $('#stat').textContent = urgent ? `Срочно: ${urgent}` : 'Всё свежее';
  $('#stat').className = 'stat' + (urgent ? ' warn' : '');
  let eaten = data.eaten, thrown = data.thrown;
  if(isShared()){
    const done = shared.items.filter(i => i.done);
    eaten = done.filter(i => i.done === 'eat').length;
    thrown = done.length - eaten;
  }
  const readOnly = isShared() && !canWrite;
  $('#foot').textContent = [
    (eaten || thrown) ? `Съедено ${eaten} · выброшено ${thrown}` : '',
    readOnly ? 'Только просмотр' : ''
  ].filter(Boolean).join(' · ');
  $('#chipName').textContent = isShared() ? (meta[mode] && meta[mode].name || 'Общий холодильник') : 'Мой холодильник';
  $('#fab').hidden = readOnly;
  animateIds = new Set();
}

const endOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59).getTime();
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

async function addMany(list){
  const clean = list.map(it => ({
    kind: it.kind, name: it.name, place: it.place || null,
    start: it.start, end: it.end, qty: Math.min(99, Math.max(1, Math.round(it.qty) || 1))
  }));
  if(!clean.length) return;
  if(isShared()){
    try{
      const batch = db.batch();
      clean.forEach(it => {
        const ref = db.collection(`fridges/${mode}/items`).doc();
        animateIds.add(ref.id);
        batch.set(ref, { ...it, by: uid, done: null });
      });
      closeSheet();
      await batch.commit();
    }catch(e){ animateIds = new Set(); fail(e); }
    return;
  }
  clean.forEach(it => { it.id = newId(); data.items.push(it); animateIds.add(it.id); });
  save();
  closeSheet();
  render();
}
const add = item => addMany([item]);

const shortName = s => s.length > 26 ? s.slice(0, 25) + '…' : s;

// Тихое обновление записи: локально или в общем холодильнике m
async function patchItem(id, patch, m = mode){
  if(m !== 'local'){
    if(!db) return false;
    try{ await db.doc(`fridges/${m}/items/${id}`).update(patch); return true; }
    catch(e){ fail(e); return false; }
  }
  const it = data.items.find(i => i.id === id);
  if(!it) return false;
  Object.assign(it, patch);
  save();
  render();
  return true;
}

// Плавный уход строки: сдвиг в сторону, затем схлопывание. dir < 0 влево (съели), > 0 вправо (выбросили)
function animateOut(id, dir){
  const el = [...document.querySelectorAll('.sw')].find(x => x.dataset.id === id);
  if(!el) return Promise.resolve();
  el.classList.remove('dl', 'dr');
  el.classList.add('out', dir < 0 ? 'dl' : 'dr');
  return new Promise(r => setTimeout(r, 400));
}

async function eatOne(id){
  const it = curItems().find(i => i.id === id);
  if(!it) return;
  const q = it.qty || 1;
  if(q <= 1){ removeItem(id, 'eat'); return; }
  const m = mode;
  closeSheet();
  if(await patchItem(id, { qty: q - 1 }, m)){
    toast('Съедена одна: ' + shortName(it.name), { label: 'Отменить', fn: () => patchItem(id, { qty: q }, m) });
  }
}

async function removeItem(id, how){
  const it = curItems().find(i => i.id === id);
  if(!it) return;
  const m = mode, eat = how === 'eat';
  const msg = (eat ? 'Съедено: ' : 'Выброшено: ') + shortName(it.name);
  closeSheet();
  await animateOut(id, eat ? -1 : 1);
  if(m === 'local'){
    const idx = data.items.indexOf(it);
    if(idx < 0){ render(); return; }
    data.items.splice(idx, 1);
    if(eat) data.eaten++; else data.thrown++;
    save();
    closeSheet();
    render();
    toast(msg, { label: 'Отменить', fn: () => {
      data.items.splice(Math.min(idx, data.items.length), 0, it);
      if(eat) data.eaten--; else data.thrown--;
      animateIds.add(it.id);
      save();
      render();
    }});
    return;
  }
  closeSheet();
  const FV = firebase.firestore.FieldValue;
  if(await patchItem(id, { done: eat ? 'eat' : 'bin', doneAt: Date.now(), doneBy: uid }, m)){
    toast(msg, { label: 'Отменить', fn: () => patchItem(id, { done: null, doneAt: FV.delete(), doneBy: FV.delete() }, m) });
  }
}

const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sameDay = (a, b) => a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const longDate = d => d.toLocaleDateString('ru-RU', { weekday:'short', day:'numeric', month:'long', year:'numeric' });
const CHEV = dir => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${dir < 0 ? 'M14.5 6l-6 6 6 6' : 'M9.5 6l6 6-6 6'}"/></svg>`;

function mountDate(el, o){
  const today = sod(new Date());
  let sel = o.value ? sod(o.value) : null;
  let view = new Date((sel || today).getFullYear(), (sel || today).getMonth(), 1);
  el.innerHTML = `
    <button type="button" class="dpbtn" aria-expanded="false"><span class="dpval"></span>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    </button>
    <div class="dppanel"><div class="dpin">
      <div class="dpchips">${o.chips.map((c, i) => `<button type="button" data-c="${i}">${esc(c.label)}</button>`).join('')}</div>
      <div class="dphead">
        <button type="button" data-n="-1" aria-label="Предыдущий месяц">${CHEV(-1)}</button><b></b>
        <button type="button" data-n="1" aria-label="Следующий месяц">${CHEV(1)}</button>
      </div>
      <div class="dpgrid"></div>
    </div></div>`;
  const btn = el.querySelector('.dpbtn'), panel = el.querySelector('.dppanel'), grid = el.querySelector('.dpgrid');
  const head = el.querySelector('.dphead b'), val = el.querySelector('.dpval');

  function paint(animate){
    val.textContent = sel ? longDate(sel) : (o.placeholder || 'Выберите дату');
    btn.classList.toggle('empty', !sel);
    head.textContent = `${MONTHS[view.getMonth()]} ${view.getFullYear()}`;
    const y = view.getFullYear(), m = view.getMonth();
    const lead = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
    let h = WD.map(w => `<i>${w}</i>`).join('') + '<span></span>'.repeat(lead);
    for(let d = 1; d <= days; d++){
      const dt = new Date(y, m, d);
      const off = (o.max && dt > o.max) || (o.min && dt < o.min);
      h += `<button type="button" data-d="${d}" class="${sameDay(dt, today) ? 'today ' : ''}${sameDay(dt, sel) ? 'sel' : ''}"${off ? ' disabled' : ''}>${d}</button>`;
    }
    grid.innerHTML = h;
    if(animate){ grid.classList.remove('flip'); void grid.offsetWidth; grid.classList.add('flip'); }
  }
  function setOpen(v){
    panel.classList.toggle('open', v);
    btn.setAttribute('aria-expanded', String(v));
    if(v) setTimeout(() => panel.scrollIntoView({ block:'nearest', behavior:'smooth' }), 330);
  }
  function pickDate(d){
    sel = sod(d);
    view = new Date(sel.getFullYear(), sel.getMonth(), 1);
    paint(false);
    setTimeout(() => setOpen(false), 140);
  }
  btn.onclick = () => setOpen(!panel.classList.contains('open'));
  el.querySelector('.dphead').onclick = e => {
    const n = e.target.closest('[data-n]'); if(!n) return;
    view = new Date(view.getFullYear(), view.getMonth() + (+n.dataset.n), 1);
    paint(true);
  };
  grid.onclick = e => {
    const d = e.target.closest('[data-d]'); if(!d || d.disabled) return;
    pickDate(new Date(view.getFullYear(), view.getMonth(), +d.dataset.d));
  };
  el.querySelector('.dpchips').onclick = e => {
    const c = e.target.closest('[data-c]'); if(!c) return;
    pickDate(addDays(today, o.chips[+c.dataset.c].days));
  };
  paint(false);
  return { get: () => sel, set: d => { sel = sod(d); view = new Date(sel.getFullYear(), sel.getMonth(), 1); paint(false); } };
}

function norm(s){
  return s.toLowerCase().replace(/ё/g, 'е').replace(/[^а-яa-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}
function match(q, list = DISHES){
  const nq = norm(q), words = nq.split(' ').filter(w => w.length > 1);
  return list.map(d => {
    const name = norm(d[0]), tokens = norm(d[0] + ' ' + d[2]).split(' ');
    let s = name.includes(nq) ? 5 : 0;
    words.forEach(w => { if(tokens.some(t => t.startsWith(w))) s += 2; });
    return { d, s };
  }).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 6).map(x => x.d);
}

/* ---------- общие холодильники ---------- */
function toast(msg, act){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('act', !!act);
  if(act){
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = act.label;
    b.onclick = () => { clearTimeout(toast.t); t.classList.remove('show'); act.fn(); };
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('show'), act ? 7000 : 3400);
}
function fail(e){
  const c = e && e.code;
  toast(c === 'permission-denied' ? 'Нет доступа. Войдите заново или проверьте правила Firestore.'
      : c === 'resource-exhausted' ? 'Исчерпана квота Firebase.'
      : c === 'unavailable' ? 'Нет сети. Попробуйте позже.'
      : 'Не удалось сохранить. Попробуйте ещё раз.');
}
const validItem = x => x && typeof x.name === 'string' && typeof x.end === 'number' && typeof x.start === 'number' && (x.kind === 'product' || x.kind === 'dish');
const saveJoined = () => db.doc(`data/users/${uid}/profile`).set({ joined });
function makeCode(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return [...crypto.getRandomValues(new Uint8Array(6))].map(x => A[x % 32]).join('');
}

function switchTo(code){
  if(unsub){ unsub(); unsub = null; }
  mode = code;
  shared = { items: [], ready: false };
  try{ localStorage.setItem(ACTIVE_KEY, code); }catch(e){}
  render();
  if(code === 'local' || !db) return;
  unsub = db.collection(`fridges/${code}/items`).onSnapshot(async snap => {
    if(mode !== code) return;
    shared.items = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(validItem);
    shared.ready = true;
    render();
    const ids = [...new Set(shared.items.map(i => i.by).filter(x => typeof x === 'string'))];
    if(!ids.length || !user) return;
    const ps = await user.profiles(ids);
    let changed = false;
    ids.forEach(id => {
      const p = ps[id];
      const n = p ? (p.isMe ? 'Вы' : p.name) : '';
      if(names[id] !== n){ names[id] = n; changed = true; }
    });
    if(changed && mode === code) render();
  }, () => { shared.ready = true; render(); toast('Нет доступа к этому холодильнику.'); });
}

function fileToJpeg(file, max = 1280){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * k));
      c.height = Math.max(1, Math.round(img.height * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}

}
function aiPrompt(){
  return `Ты помогаешь вести учёт продуктов в холодильнике. На фото еда: продукты и/или готовые блюда.
Определи КАЖДЫЙ отдельный продукт по его реальному внешнему виду: что это за продукт на самом деле (вид, сорт, форма, состояние), а не только по надписи на упаковке.
Если на упаковке видна марка, жирность, вкус или вес, коротко добавь это в название (например «Молоко 2,5%», «Йогурт клубничный», «Сыр моцарелла»). Если упаковки нет, определи по виду (например «Помидоры черри», «Куриные бёдра сырые»).
Одинаковые штуки объединяй в одну запись и укажи их число в count.
Если на упаковке чётко виден срок годности, верни его в expiry в формате YYYY-MM-DD, иначе null. Не угадывай дату, которой не видно.
shelf_days: сколько целых суток считая от сегодняшнего дня этот продукт ещё можно хранить в месте place с учётом видимого состояния (зрелость, увядание, признаки порчи сокращают срок).
place: fridge, freezer или shelf, где его обычно хранят.
kind: product для сырых и упакованных продуктов, dish для приготовленных блюд.
uncertain: true, если ты не уверен, что это за продукт.
Игнорируй не-еду, посуду, людей и фон. Не придумывай то, чего нет на фото.
Сегодня ${localDate()}.
Ответь ТОЛЬКО JSON-массивом без пояснений: [{"name":"…","kind":"product","place":"fridge","count":1,"expiry":null,"shelf_days":7,"uncertain":false}]`;
}

function parseAi(text){
  let arr;
  try{ arr = JSON.parse(text); }
  catch(e){
    const m = String(text).match(/\[[\s\S]*\]/);
    if(!m) return [];
    try{ arr = JSON.parse(m[0]); }catch(e2){ return []; }
  }
  if(arr && !Array.isArray(arr)) arr = arr.items || arr.products || [];
  return Array.isArray(arr) ? arr : [];
}

function toStage(a){
  if(!a || typeof a !== 'object') return null;
  const nowMs = Date.now(), today = sod(new Date());
  const name = String(a.name || '').trim().slice(0, 40);
  if(!name) return null;
  const kind = a.kind === 'dish' ? 'dish' : 'product';
  const qty = Math.min(99, Math.max(1, Math.round(Number(a.count)) || 1));
  const unsure = a.uncertain === true;
  let days = Number(a.shelf_days);
  if(!(days > 0)) days = kind === 'dish' ? 3 : 7;
  days = Math.min(kind === 'dish' ? 14 : 730, Math.max(kind === 'dish' ? 0.5 : 1, days));
  if(kind === 'dish') return { kind, name, place: null, qty, start: nowMs, end: nowMs + days * DAY, approx: true, unsure };
  const place = ['fridge', 'freezer', 'shelf'].includes(a.place) ? a.place : 'fridge';
  let exp = null;
  if(typeof a.expiry === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(a.expiry)){
    const [y, m, d] = a.expiry.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    if(dt >= addDays(today, -30) && dt <= addDays(today, 1095)) exp = dt;
  }
  const end = exp ? endOfDay(exp) : endOfDay(addDays(today, Math.ceil(days)));
  return { kind, name, place, qty, start: nowMs, end, approx: !exp, unsure };
}

async function recognize(b64, key){
  const first = lsGet(AI_MODEL) || DEFAULT_MODEL;
  const models = [first, ...FALLBACK_MODELS.filter(m => m !== first)];
  let missing = false;
  for(const m of models){
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({
        contents: [{ role: 'user', parts: [{ text: aiPrompt() }, { inline_data: { mime_type: 'image/jpeg', data: b64 } }] }],
        generationConfig: { responseMimeType: 'application/json', temperature: 0.2 }
      })
    });
    if(r.status === 404){ missing = true; continue; }
    const j = await r.json().catch(() => ({}));
    if(!r.ok){
      const err = new Error((j.error && j.error.message) || 'api');
      err.status = r.status;
      throw err;
    }
    const parts = ((j.candidates || [])[0] || {}).content;
    const text = ((parts && parts.parts) || []).filter(p => !p.thought).map(p => p.text || '').join('');
    return parseAi(text).map(toStage).filter(Boolean).slice(0, 20);
  }
  const err = new Error(missing ? 'model' : 'api');
  err.code = 'model';
  throw err;
}

function aiErrText(e){
  const s = e && e.status, m = String(e && e.message || '');
  if(e && e.code === 'model') return 'Модель недоступна. Поменяйте её в настройках распознавания.';
  if(s === 400 && /API key/i.test(m)) return 'Ключ Gemini не подошёл. Проверьте его в настройках.';
  if(s === 401 || s === 403) return 'Ключ Gemini не подошёл или у него нет доступа.';
  if(s === 429) return 'Лимит бесплатных запросов исчерпан. Попробуйте позже.';
  if(e instanceof TypeError) return 'Нет сети или запрос заблокирован.';
  return 'Не удалось распознать. Попробуйте ещё раз.';
}

async function scanFile(file){
  if(!file) return;
  const key = lsGet(AI_KEY);
  if(!key){ showAiSettings('add'); toast('Сначала вставьте ключ Gemini'); return; }
  scanning = true; paintScan();
  try{
    const b64 = await fileToJpeg(file);
    const found = await recognize(b64, key);
    if(!$('#stg')) return;               // окно закрыли, пока шло распознавание
    if(!found.length) toast('Еды на фото не нашлось. Попробуйте ближе и при хорошем свете.');
    else { found.forEach(it => stage.push(it)); toast('Найдено: ' + found.length + '. Проверьте и сохраните.'); }
  }catch(e){
    console.error(e);
    toast(aiErrText(e));
  }
  scanning = false; paintScan(); paintStage();
}

/* ---------- штрихкод (Open Food Facts) ---------- */
const BAR_FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e'];
function stopScan(){
  if(scanStop){ const f = scanStop; scanStop = null; f(); }
}
let zxingP = null;
function loadZXing(){
  if(window.ZXingBrowser) return Promise.resolve(window.ZXingBrowser);
  if(!zxingP) zxingP = new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = 'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js';
    el.onload = () => window.ZXingBrowser ? res(window.ZXingBrowser) : rej(new Error('zxing'));
    el.onerror = () => { zxingP = null; rej(new Error('zxing')); };
    document.head.appendChild(el);
  });
  return zxingP;
}

async function offName(code){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 10000);
  try{
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}?fields=product_name,product_name_ru,generic_name,brands`, { signal: ctl.signal });
    if(r.status === 404) return '';
    if(!r.ok) throw new Error('off');
    const j = await r.json();
    const p = j && j.product;
    if(!p) return '';
    let n = String(p.product_name_ru || p.product_name || p.generic_name || '').trim();
    if(!n) return '';
    const b = String(p.brands || '').split(',')[0].trim();
    if(b && !norm(n).includes(norm(b))) n += ' ' + b;
    return n.slice(0, 40);
  }finally{ clearTimeout(t); }
}

function openBarcode(){
  openSheet(`
    <h2 class="sh">Штрихкод</h2>
    <p class="hint">Наведите камеру на штрихкод. Название подставится из Open Food Facts, срок годности укажете сами.</p>
    <div class="cam"><video id="bv" playsinline muted></video><i class="aim"></i></div>
    <p class="hint" id="bs">Запуск камеры…</p>
    <form id="bf" class="form" style="margin-top:12px" novalidate>
      <div class="field"><label for="bc">Или введите код вручную</label>
        <input id="bc" inputmode="numeric" maxlength="14" placeholder="4601234567890" autocomplete="off"></div>
      <button class="primary">Найти</button>
      <button type="button" class="ghost" data-a="addback">Назад</button>
    </form>`);
  $('#bf').onsubmit = e => {
    e.preventDefault();
    const c = $('#bc').value.replace(/\D/g, '');
    if(c.length < 8){ toast('Введите код полностью: 8–13 цифр'); return; }
    lookupCode(c);
  };
  startScan();
}

async function startScan(){
  const v = $('#bv');
  if(!v) return;
  const say = t => { const el = $('#bs'); if(el) el.textContent = t; };
  let dead = false, stream = null, timer = 0;
  scanStop = () => { dead = true; clearTimeout(timer); if(stream) stream.getTracks().forEach(t => t.stop()); };
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ say('Камера недоступна. Введите код вручную.'); return; }
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
  }catch(e){ if(!dead) say('Нет доступа к камере. Введите код вручную.'); return; }
  if(dead){ stream.getTracks().forEach(t => t.stop()); return; }
  v.srcObject = stream;
  try{ await v.play(); }catch(e){}
  let det = null, zx = null;
  if('BarcodeDetector' in window){ try{ det = new BarcodeDetector({ formats: BAR_FORMATS }); }catch(e){ det = null; } }
  if(!det){
    try{ const Z = await loadZXing(); zx = new Z.BrowserMultiFormatReader(); }
    catch(e){ if(!dead) say('Сканер не загрузился. Введите код вручную.'); return; }
  }
  if(dead) return;
  say('Наведите камеру на штрихкод');
  const cv = document.createElement('canvas');
  const tick = async () => {
    if(dead) return;
    let code = '';
    try{
      if(det){
        const r = await det.detect(v);
        if(r.length) code = String(r[0].rawValue || '');
      }else if(v.videoWidth){
        const k = Math.min(1, 800 / v.videoWidth);
        cv.width = Math.round(v.videoWidth * k); cv.height = Math.round(v.videoHeight * k);
        cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
        try{ code = zx.decodeFromCanvas(cv).getText(); }catch(e){}
      }
    }catch(e){}
    if(dead) return;
    if(/^\d{8,14}$/.test(code)){ lookupCode(code); return; }
    timer = setTimeout(tick, 220);
  };
  tick();
}

async function lookupCode(code){
  stopScan();
  const say = t => { const el = $('#bs'); if(el) el.textContent = t; };
  say('Ищу в Open Food Facts…');
  try{
    const name = await offName(code);
    if(!$('#bf')) return;                   // окно закрыли, пока шёл поиск
    openAdd('product');
    if(name){ $('#pn').value = name; paintSave(); toast('Найдено: ' + name); }
    else toast('Код ' + code + ' не найден в базе. Введите название вручную.');
  }catch(e){
    say('Нет сети или база недоступна. Попробуйте ещё раз.');
    const bc = $('#bc'); if(bc) bc.value = code;
  }
}

/* ---------- резервная копия ---------- */
const nonNeg = v => Number.isFinite(v) && v > 0 ? Math.floor(v) : 0;

function exportData(){
  if(!data.items.length && !data.eaten && !data.thrown){ toast('В «Моём холодильнике» пока нечего сохранять'); return; }
  const payload = { app: 'svezhest', v: 1, exported: new Date().toISOString(), eaten: data.eaten, thrown: data.thrown, items: data.items };
  const name = 'svezhest-' + localDate() + '.json';
  const file = new File([JSON.stringify(payload, null, 1)], name, { type: 'application/json' });
  const download = () => {
    const url = URL.createObjectURL(file), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('Копия сохранена: ' + name);
  };
  if(matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })){
    navigator.share({ files: [file], title: 'Копия «Свежести»' })
      .then(() => toast('Копия готова'))
      .catch(e => { if(!e || e.name !== 'AbortError') download(); });
  }else download();
}

function cleanImport(o){
  const arr = Array.isArray(o) ? o : (o && Array.isArray(o.items) ? o.items : []);
  const seen = new Set(), out = [];
  for(const x of arr.slice(0, 1000)){
    if(!validItem(x) || !Number.isFinite(x.start) || !Number.isFinite(x.end)) continue;
    const name = x.name.trim().slice(0, 60);
    if(!name) continue;
    const id = typeof x.id === 'string' && x.id && x.id.length <= 40 && !seen.has(x.id) ? x.id : newId();
    seen.add(id);
    const it = {
      id, kind: x.kind, name,
      place: ['fridge', 'freezer', 'shelf'].includes(x.place) ? x.place : null,
      start: x.start, end: x.end,
      qty: Math.min(99, Math.max(1, Math.round(Number(x.qty)) || 1))
    };
    if(Number.isFinite(x.opened)) it.opened = x.opened;
    out.push(it);
  }
  return out;
}

function showImport(){
  if(!pendingImport) return;
  const n = pendingImport.list.length, has = data.items.length > 0;
  openSheet(`
    <h2 class="sh">Загрузить копию</h2>
    <p class="hint">В файле: ${n} ${plural(n, ['запись', 'записи', 'записей'])}. Они попадут в «Мой холодильник» на этом устройстве.</p>
    <div class="actions">
      <button class="primary" data-s="imp-merge">${has ? 'Добавить к текущим' : 'Загрузить'}</button>
      ${has ? `<button class="ghost" data-s="imp-replace">Заменить текущие (${data.items.length})</button>` : ''}
      <button class="ghost" data-s="back">Отмена</button>
    </div>`);
}

function applyImport(replace){
  if(!pendingImport) return;
  const { list, eaten, thrown } = pendingImport;
  pendingImport = null;
  let added = list.length;
  if(replace){
    data.items = list; data.eaten = eaten; data.thrown = thrown;
  }else{
    const ids = new Set(data.items.map(i => i.id));
    const fresh = list.filter(it => !ids.has(it.id));
    added = fresh.length;
    data.items.push(...fresh);
    data.eaten = Math.max(data.eaten, eaten); data.thrown = Math.max(data.thrown, thrown);
  }
  save();
  closeSheet();
  if(isShared()) switchTo('local'); else render();
  toast('Загружено: ' + added + ' ' + plural(added, ['запись', 'записи', 'записей']));
}

$('#imp').onchange = async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!f) return;
  try{
    if(f.size > 5e6) throw new Error('big');
    const o = JSON.parse(await f.text());
    const list = cleanImport(o);
    if(!list.length){ toast('В файле не нашлось продуктов'); return; }
    pendingImport = { list, eaten: nonNeg(o && o.eaten), thrown: nonNeg(o && o.thrown) };
    showImport();
  }catch(err){ toast('Не удалось прочитать файл копии'); }
};

/* ---------- свайпы по строке: влево «Съели», вправо «Выбросить» ---------- */
const SW_MIN = 80;
const swWrap = el => el.closest('.sw');
function springBack(it){
  const w = swWrap(it);
  it.style.transition = '';
  it.style.translate = '';
  if(w){ w.classList.remove('drag'); setTimeout(() => { if(!w.classList.contains('out')) w.classList.remove('dl', 'dr'); }, 280); }
}
$('#list').addEventListener('pointerdown', e => {
  const it = e.target.closest('.item');
  if(!it || (isShared() && !canWrite) || (e.pointerType === 'mouse' && e.button !== 0)) return;
  if(swWrap(it).classList.contains('out')) return;
  swipe = { it, id: it.dataset.id, x0: e.clientX, y0: e.clientY, dx: 0, on: false, pid: e.pointerId };
});
$('#list').addEventListener('pointermove', e => {
  if(!swipe || e.pointerId !== swipe.pid) return;
  const dx = e.clientX - swipe.x0, dy = e.clientY - swipe.y0;
  if(!swipe.on){
    if(Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ swipe = null; return; }
    if(Math.abs(dx) < 12 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    swipe.on = true;
    try{ swipe.it.setPointerCapture(e.pointerId); }catch(_){}
    swipe.it.style.transition = 'none';
  }
  swipe.dx = dx;
  const w = swWrap(swipe.it);
  w.classList.add('drag');
  w.classList.toggle('dl', dx < 0);
  w.classList.toggle('dr', dx > 0);
  swipe.it.style.translate = dx + 'px 0';
});
function swipeEnd(e, cancel){
  if(!swipe || e.pointerId !== swipe.pid) return;
  const s = swipe;
  swipe = null;
  if(!s.on) return;
  swipedAt = Date.now();
  const far = Math.abs(s.dx) >= Math.max(SW_MIN, (s.it.offsetWidth || 300) * 0.28);
  if(cancel || !far){ springBack(s.it); return; }
  if(s.dx < 0){
    const it = curItems().find(i => i.id === s.id);
    if(it && (it.qty || 1) > 1){ springBack(s.it); eatOne(s.id); }
    else removeItem(s.id, 'eat');
  }else removeItem(s.id, 'bin');
}
$('#list').addEventListener('pointerup', e => swipeEnd(e, false));
$('#list').addEventListener('pointercancel', e => swipeEnd(e, true));

/* ---------- push-уведомления ---------- */
const VAPID_KEY = "BDI8OytB86b46tRDYx8kU9hT5XjOh6WEpEv3Fq2rJpK17Hpn858k8e0PmjBWXzyCHhPy7SGox6bmmbCruBm5IEc";
const PUSH_KEY = 'svezhest-push';
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const myTz = () => { try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; }catch(e){ return 'UTC'; } };

async function pushSupported(){
  try{
    if(!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) return false;
    if(typeof firebase === 'undefined' || typeof firebase.messaging !== 'function') return false;
    return !!(await Promise.resolve(firebase.messaging.isSupported()));
  }catch(e){ return false; }
}
async function pushToken(){
  const reg = await navigator.serviceWorker.ready;
  return firebase.messaging().getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
}
async function savePushToken(token, old){
  const ref = db.doc(`pushTokens/${uid}`), FV = firebase.firestore.FieldValue;
  if(old && old !== token) await ref.set({ tokens: FV.arrayRemove(old) }, { merge: true });
  await ref.set({ tokens: FV.arrayUnion(token), tz: myTz(), updated: Date.now() }, { merge: true });
}
async function enablePush(){
  if(!db){ toast('Сначала войдите через Google'); return; }
  if(String(VAPID_KEY).startsWith('ВСТАВЬТЕ')){ toast('Не задан VAPID_KEY в index.html'); return; }
  if(isIOS && !isStandalone()){ toast('На iPhone сначала установите приложение: Поделиться → На экран «Домой»'); return; }
  if(!('Notification' in window) || typeof firebase.messaging !== 'function'){ toast('Это устройство не поддерживает уведомления'); return; }
  try{
    const perm = await Notification.requestPermission();   // вызываем сразу по нажатию, иначе Safari откажет
    if(perm !== 'granted'){ toast('Уведомления запрещены в настройках браузера'); return; }
    if(!(await pushSupported())){ toast('Это устройство не поддерживает уведомления'); return; }
    const token = await pushToken();
    if(!token){ toast('Не удалось получить токен уведомлений'); return; }
    await savePushToken(token, lsGet(PUSH_KEY));
    lsSet(PUSH_KEY, token);
    closeSheet();
    toast('Уведомления включены');
  }catch(e){ console.error(e); toast('Не удалось включить уведомления'); }
}
async function disablePush(){
  const old = lsGet(PUSH_KEY);
  try{ if(typeof firebase.messaging === 'function') await firebase.messaging().deleteToken(); }catch(e){}
  try{ if(db && old) await db.doc(`pushTokens/${uid}`).set({ tokens: firebase.firestore.FieldValue.arrayRemove(old) }, { merge: true }); }catch(e){}
  lsSet(PUSH_KEY, '');
  closeSheet();
  toast('Уведомления отключены');
}
async function refreshPush(){
  try{
    const old = lsGet(PUSH_KEY);
    if(!old || !db || !('Notification' in window) || Notification.permission !== 'granted') return;
    if(!(await pushSupported())) return;
    const token = await pushToken();
    if(token){ await savePushToken(token, old); lsSet(PUSH_KEY, token); }
  }catch(e){}
}

['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
document.addEventListener('touchmove', e => { if(e.touches.length > 1) e.preventDefault(); }, { passive:false });

document.addEventListener('copy', e => { if(!inField(e)) e.preventDefault(); });
document.addEventListener('cut', e => { if(!inField(e)) e.preventDefault(); });
